name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
      - crsr-feature/car-on-map
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - crsr-feature/car-on-map

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      # Build on the GitHub runner (glibc >= 2.35) instead of Azure's Oryx image.
      # Oryx's older glibc (2.31) can't load Rollup 4's native binary (needs
      # GLIBC_2.32), which surfaced as a misleading "@rollup/rollup-linux-x64-gnu"
      # error. Building here also bakes the VITE_* env into the bundle reliably.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        # Use `npm install` (not `npm ci`) because package-lock.json is out of
        # sync with package.json; install re-resolves and also fetches the correct
        # platform-specific Rollup native binary for the runner.
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_VIDEO_API_BASE_URL: ${{ secrets.VITE_VIDEO_API_BASE_URL }}
          VITE_VIDEO_API_CODE: ${{ secrets.VITE_VIDEO_API_CODE }}
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_ISLAND_05B983A03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations ######
          # We build above on the runner and only upload the prebuilt output here.
          app_location: "build" # Prebuilt static content
          api_location: "" # Api source code path - optional
          output_location: "" # Not used when skip_app_build is true
          skip_app_build: true
          skip_api_build: true
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_ISLAND_05B983A03 }}
          action: "close"
